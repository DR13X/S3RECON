[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3recon"
version = "1.0.0"
description = "Authorized cloud-storage exposure reconnaissance and auditing tool for S3, GCS, and Azure Blob"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "S3RECON Contributors" }]
keywords = ["security", "cloud", "reconnaissance", "s3", "gcs", "azure", "bucket", "exposure", "audit", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["httpx>=0.27.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.4", "mypy>=1.10", "types-PyYAML", "pre-commit>=3.7"]

[project.scripts]
s3recon = "s3recon.cli.main:main"

[project.urls]
Homepage = "https://github.com/DR13X/S3RECON"
Documentation = "https://github.com/DR13X/S3RECON#readme"
Repository = "https://github.com/DR13X/S3RECON"
Issues = "https://github.com/DR13X/S3RECON/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["s3recon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["s3recon/tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true
